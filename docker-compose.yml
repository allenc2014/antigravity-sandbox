services:
  antigravity:
    build: .
    container_name: antigravity-desktop
    ports:
      - "3000:3000"          # webtop web UI (HTTP)
      - "3001:3001"          # webtop web UI (HTTPS)
    volumes:
      - ./config:/config     # abc's home — persists settings, extensions, dotfiles
      - ./workspace:/workspace
    restart: unless-stopped
    privileged: true         # required for Docker-in-Docker (nested dockerd)
    shm_size: 2g
    environment:
      - PUID=1000                              # map "abc" to this host UID
      - PGID=1000                              # map "abc" to this host GID
      - TZ=${TZ:-America/New_York}             # set in .env
      - PASSWORD=${PASSWORD:-antigravity}      # set in .env (change in production)
      - GIT_USER_NAME=${GIT_USER_NAME:-}   # set in .env or shell env
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-} # set in .env or shell env
      - GIT_CREDENTIAL_HELPER=${GIT_CREDENTIAL_HELPER:-}                    # store | cache | <unset>
      - GIT_CREDENTIAL_CACHE_TIMEOUT=${GIT_CREDENTIAL_CACHE_TIMEOUT:-900}  # seconds, only used with 'cache'

